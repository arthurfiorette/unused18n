name: Publish to NPM

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Stable release tag to publish
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    runs-on: ubuntu-latest

    environment:
      name: NPM Registry
      url: https://www.npmjs.com/package/unused18n

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          cache: true
          install: true

      - name: Verify stable release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: >-
          node --input-type=module -e "import packageJson from './package.json' with { type: 'json' };
          process.exit(process.env.RELEASE_TAG === 'v' + packageJson.version &&
          !packageJson.version.includes('-') ? 0 : 1)"

      - name: Check
        run: pnpm check

      - name: Update NPM
        run: npm install --global npm@latest

      - name: Publish to NPM
        run: npm publish --access public --provenance
